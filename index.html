<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Травка VPN</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
            position: relative;
        }
        h1 { margin-top: 0; color: #38bdf8; font-size: 24px; }
        .status { 
            background: #065f46; 
            color: #34d399; 
            padding: 8px 16px; 
            border-radius: 20px; 
            display: inline-block; 
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 14px;
        }
        p { color: #94a3b8; line-height: 1.5; font-size: 14px; margin-bottom: 25px; }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            background-color: #0284c7;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            transition: background 0.2s;
            box-sizing: border-box;
            border: none;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            text-align: center;
        }
        .btn:hover {
            background-color: #0369a1;
        }
        .btn-secondary {
            background-color: #334155;
        }
        .btn-secondary:hover {
            background-color: #475569;
        }
        #toast {
            visibility: hidden;
            background-color: #10b981;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 10px;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: visibility 0.2s, opacity 0.2s;
            opacity: 0;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🌿 Травка VPN</h1>
        <div class="status">Travkavpn работает стабильно!</div>
        <p>Последнее обновление списков было:<br><strong id="update-time">загрузка...</strong></p>
        
        <div class="btn-group">
            <a href="#" id="btn-happ" class="btn">Открыть в Happ</a>
            <a href="#" id="btn-hiddify" class="btn btn-secondary">Открыть в Hiddify</a>
            <a href="#" id="btn-v2raytun" class="btn btn-secondary">Открыть в V2rayTun</a>
        </div>

        <div id="toast">Ссылка скопирована</div>
    </div>

    <script>
        const githubRawUrl = "https://raw.githubusercontent.com/TravkaVPN/TravkaVPNsub/refs/heads/main/sub.txt";
        const encodedUrl = encodeURIComponent(githubRawUrl);

        document.getElementById('btn-happ').href = `happ://add/?url=${encodedUrl}`;
        document.getElementById('btn-hiddify').href = `hiddify://import?url=${encodedUrl}`;
        document.getElementById('btn-v2raytun').href = `v2raytun://import?url=${encodedUrl}`;

        document.querySelectorAll('.btn-group a').forEach(btn => {
            btn.addEventListener('click', function() {
                setTimeout(() => {
                    navigator.clipboard.writeText(githubRawUrl);
                    showToast();
                }, 500);
            });
        });

        function showToast() {
            const toast = document.getElementById("toast");
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        async function getLastUpdate() {
            try {
                const response = await fetch(`https://api.github.com/repos/TravkaVPN/TravkaVPNsub/commits?path=sub.txt&per_page=1`);
                const commits = await response.json();
                
                if (commits && commits.length > 0) {
                    const commitDate = new Date(commits[0].commit.committer.date);
                    document.getElementById('update-time').innerText = commitDate.toLocaleString("ru-RU", {
                        timeZone: "Europe/Moscow",
                        day: "numeric",
                        month: "long",
                        hour: "2-digit",
                        minute: "2-digit"
                    });
                } else {
                    document.getElementById('update-time').innerText = "недавно";
                }
            } catch (e) {
                document.getElementById('update-time').innerText = "не удалось загрузить";
            }
        }

        getLastUpdate();
    </script>
</body>
</html>
