<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Травка VPN</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { margin-top: 0; color: #38bdf8; }
        .status { 
            background: #065f46; 
            color: #34d399; 
            padding: 8px 16px; 
            border-radius: 20px; 
            display: inline-block; 
            font-weight: bold;
            margin-bottom: 20px;
        }
        p { color: #94a3b8; line-height: 1.5; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🌿 Травка VPN</h1>
        <div class="status">Подписка активна</div>
        <p>Вставьте эту ссылку в ваш VPN-клиент для импорта серверов.</p>
    </div>

    <script>
        fetch('sub.txt')
            .then(response => response.text())
            .then(data => {
                const userAgent = navigator.userAgent.toLowerCase();
                const isVpnClient = userAgent.includes('v2ray') || 
                                    userAgent.includes('hiddify') || 
                                    userAgent.includes('happ') || 
                                    userAgent.includes('clash') || 
                                    userAgent.includes('sing-box') ||
                                    userAgent.includes('dart') || 
                                    userAgent.includes('okhttp');

                if (isVpnClient) {
                    document.open();
                    document.write('<pre>' + data + '</pre>');
                    document.close();
                }
            });
    </script>
</body>
</html>
