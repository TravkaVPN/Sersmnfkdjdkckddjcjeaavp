        .card {

            padding: 35px 30px;

            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { margin-top: 0; color: #38bdf8; font-size: 24px; }
        .status { 
            background: #065f46; 
            color: #34d399; 
            padding: 8px 16px; 
            border-radius: 20px; 
            display: inline-block; 
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 14px;
        }
        p { color: #94a3b8; line-height: 1.5; font-size: 14px; margin-bottom: 25px; }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            background-color: #0284c7;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            transition: background 0.2s;
            box-sizing: border-box;
            text-align: center;
        }
        .btn:hover {

        }
        .btn-secondary {

        async function getLastUpdate() {

                    const commitDate = new Date(commits[0].commit.committer.date);
                    document.getElementById('update-time').innerText = commitDate.toLocaleString("ru-RU", {
                        timeZone: "Europe/Moscow",
                        day: "numeric",
                        month: "long",
                        hour: "2-digit",
                        minute: "2-digit"
                    });
                } else {
